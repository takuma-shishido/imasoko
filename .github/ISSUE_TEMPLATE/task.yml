name: "🛠 タスク"
description: 実装・調査などの作業タスク
title: "[Task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        タイトルは `<内容の絵文字> [Task] <日本語>`(例:`🔌 [Task] WebSocket 実配線`)にしてください。
  - type: textarea
    id: goal
    attributes:
      label: 🎯 ゴール
      description: このタスクで達成したいこと
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 🧩 やること(チェックリスト)
      value: |
        - [ ]
  - type: textarea
    id: done
    attributes:
      label: 🏁 完了条件
      description: これが満たせたら完了(受け入れ条件)
      value: |
        - ✅
  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      options: [web, server, docs, infra/CI]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: "p0=当日必須/ブロッカー, p1=高, p2=中(対応する priority:* ラベルは担当が付与)"
      options: [p0, p1, p2]
  - type: textarea
    id: notes
    attributes:
      label: 📚 参考 / 補足
      description: 関連ドキュメント・ファイルへのリンクなど
