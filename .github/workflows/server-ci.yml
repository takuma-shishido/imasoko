name: server-ci

on:
  pull_request:
    paths: ["apps/server/**", ".github/workflows/server-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/server/**", ".github/workflows/server-ci.yml"]

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

# 同一リポジトリからの PR では ruff format の整形差分を bot が自動コミットする(issue #83)
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    env:
      # 自動整形するか:同一リポジトリからの PR のみ true。
      # fork からの PR は GITHUB_TOKEN に push 権限が無いため従来どおりチェックのみ。
      AUTOFIX: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 自動整形をコミットできるよう、PR のマージ参照ではなく head ブランチを checkout する
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # ── 自動整形(issue #83):差分があれば bot がコミットして push する。
      #    GITHUB_TOKEN の push は workflow を再トリガーしないため無限ループはしない。
      #    以降の ruff check / pytest は整形後のツリーで検証される。
      - name: ruff format 自動整形
        if: env.AUTOFIX == 'true'
        run: ruff format .
      - name: 整形差分を自動コミット
        if: env.AUTOFIX == 'true'
        working-directory: .
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style(server): ruff format 自動整形"
          git push origin "HEAD:${{ github.head_ref }}"
      - run: ruff check .
      # fork からの PR / main への push は従来どおりチェックのみ
      - name: ruff format チェック
        if: env.AUTOFIX != 'true'
        run: ruff format --check .
      - name: mypy (型チェック・当面は非ブロッキング)
        run: mypy app
        continue-on-error: true
      - run: pytest -q
