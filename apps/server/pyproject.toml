[project]
name = "imasoko-server"
version = "0.1.0"
description = "いまそこ — 集合支援 Web アプリのサーバー(FastAPI)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
